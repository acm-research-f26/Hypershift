[project]
name = "hypershift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "exchange-calendars>=4.13.2",
    "geoopt>=0.5.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "torch>=2.14.0",
    "torch-geometric>=2.8.0.post1",
    "yfinance>=1.7.0",
]

[dependency-groups]
experiments = [
    "scikit-fuzzy==0.5.0",
    "shapediscover @ git+https://github.com/LuisScoccola/shapediscover.git@7b9aa1631c6893f3f08d3ce9f0310d4d2b934567",
    "optuna>=4.0",
    "ripser>=0.6.12",
    "scipy>=1.15",
    "statsmodels>=0.14",
    "arch>=7.2",
    "matplotlib>=3.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[project.optional-dependencies]
cuda = ["torch==2.14.0"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", extra = "cuda" }]
